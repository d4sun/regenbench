name: smoke

on:
  push:
    branches: [main]
  pull_request:
  # Quarterly dependency re-pin review (verify_pins.py against upstream).
  schedule:
    - cron: "0 9 1 */3 *"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Container-dependent validity tests are skipped automatically when
      # podman/the images are absent; everything else runs hermetically.
      - name: Run unit/property suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Mount-flag guard (:z/:Z static check)
        run: python3 ci/check_mount_flags.py

      - name: Known-answer verdict matrix
        run: |
          sudo apt-get update && sudo apt-get install -y podman
          ./containers/base/build.sh
          ./containers/picklescan/build.sh
          ./containers/modelscan/build.sh
          ./containers/fickling/build.sh
          ./containers/modeltracer/build.sh
          python3 scripts/run_known_answers.py --gguf-holdout 4

  verify-pins:
    # Network job: confirms pinned scanner commits/tags/env vars still match
    # upstream. Scheduled quarterly via the trigger above.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify upstream pins
        run: python3 scripts/verify_pins.py

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman python3

      # ci/smoke.sh builds base + panel images, generates the torch corpus
      # inside the base container, and runs the assertions. It exits non-zero
      # (failing the job) if any artifact's (verdict, exit_code) mismatches
      # ci/corpus/expected.json.
      - name: Run smoke suite
        id: smoke
        run: |
          set -o pipefail
          ./ci/smoke.sh 2>&1 | tee smoke-report.txt
        working-directory: ${{ github.workspace }}

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
          retention-days: 7
schema_version: "1.0"
dangerous_callables:
  - module: "os"
    name: "system"
    category: "command_execution"
    description: "Executes the command in a subshell."
    genuine_code_exec: true

  - module: "posix"
    name: "system"
    category: "command_execution"
    description: "Executes the command on Unix systems."
    genuine_code_exec: true

  - module: "nt"
    name: "system"
    category: "command_execution"
    description: "Executes the command on Windows systems."
    genuine_code_exec: true
    platform: "windows"

  - module: "subprocess"
    name: "Popen"
    category: "command_execution"
    description: "Executes a child program in a new process."
    genuine_code_exec: true

  - module: "subprocess"
    name: "run"
    category: "command_execution"
    description: "Run command with arguments and wait for it to complete."
    genuine_code_exec: true

  - module: "subprocess"
    name: "call"
    category: "command_execution"
    description: "Run command with arguments and return status code."
    genuine_code_exec: true

  - module: "subprocess"
    name: "check_call"
    category: "command_execution"
    description: "Run command with arguments and raise on non-zero exit."
    genuine_code_exec: true

  - module: "subprocess"
    name: "check_output"
    category: "command_execution"
    description: "Run command with arguments and return output."
    genuine_code_exec: true

  - module: "subprocess"
    name: "getstatusoutput"
    category: "command_execution"
    description: "Run command in shell and return status/output."
    genuine_code_exec: true

  - module: "subprocess"
    name: "getoutput"
    category: "command_execution"
    description: "Run command in shell and return output."
    genuine_code_exec: true

  - module: "builtins"
    name: "eval"
    category: "code_evaluation"
    description: "Parses and evaluates a Python expression string."
    genuine_code_exec: true

  - module: "builtins"
    name: "exec"
    category: "code_execution"
    description: "Supports dynamic execution of Python code."
    genuine_code_exec: true

  - module: "runpy"
    name: "run_module"
    category: "code_execution"
    description: "Locates and executes a Python module."
    genuine_code_exec: true

  - module: "runpy"
    name: "run_path"
    category: "code_execution"
    description: "Executes the code at the specified path."
    genuine_code_exec: true

  - module: "numpy.testing._private.utils"
    name: "runstring"
    category: "code_execution"
    description: "Numpy testing helper that executes code strings."
    genuine_code_exec: true

  - module: "pandas"
    name: "eval"
    category: "code_evaluation"
    description: "Evaluate a Python expression as a string using various backends."
    genuine_code_exec: true

  - module: "sympy"
    name: "sympify"
    category: "code_evaluation"
    description: "Converts arbitrary strings into SymPy expressions, which can trigger code evaluation."
    genuine_code_exec: true

  - module: "IPython.utils.process"
    name: "system"
    category: "command_execution"
    description: "Executes command using system shell in IPython environment."
    genuine_code_exec: true

  - module: "yaml"
    name: "unsafe_load"
    category: "serialization_vulnerability"
    description: "YAML deserializer that allows arbitrary object construction."
    genuine_code_exec: true

  - module: "builtins"
    name: "__import__"
    category: "import_smuggling"
    description: "Dynamic import primitive used to hide dangerous-module references."
    genuine_code_exec: false

  - module: "builtins"
    name: "getattr"
    category: "import_smuggling"
    description: "Attribute-resolution primitive used to hide dangerous-callable names."
    genuine_code_exec: false

  - module: "_pickle"
    name: "loads"
    category: "import_smuggling"
    description: "Nested-deserialization primitive hiding payloads in bytes blobs."
    genuine_code_exec: false

  - module: "pty"
    name: "spawn"
    category: "command_execution"
    description: "Spawns /bin/sh connected to a pseudo-terminal (shell alias of system())."
    genuine_code_exec: true

  - module: "os"
    name: "popen"
    category: "command_execution"
    description: "Opens a pipe to/from a shell command."
    genuine_code_exec: true

  - module: "platform"
    name: "popen"
    category: "command_execution"
    description: "Deprecated shell-command wrapper around os.popen."
    genuine_code_exec: true

  - module: "posix"
    name: "execv"
    category: "command_execution"
    description: "Replaces the running process image with a new executable."
    genuine_code_exec: true

  - module: "builtins"
    name: "compile"
    category: "runtime_compile"
    description: "Compiles Python source string to code object; REDUCE with (source, '<string>', 'exec') yields executable code object."
    genuine_code_exec: true

  - module: "types"
    name: "CodeType"
    category: "runtime_compile"
    description: "Low-level code object constructor; final stage of compile→CodeType chain for arbitrary code execution."
    genuine_code_exec: true

  - module: "types"
    name: "FunctionType"
    category: "runtime_compile"
    description: "Constructs function from CodeType; wraps CodeType for direct invocation via REDUCE."
    genuine_code_exec: true

  - module: "ctypes"
    name: "CDLL"
    category: "constructor"
    description: "Constructor-based sink: loads shared library via __init__ (e.g. CDLL('libc.so.6')); bypasses top-level GLOBAL name scanners."
    genuine_code_exec: true

  - module: "urllib.request"
    name: "urlopen"
    category: "constructor"
    description: "Constructor/network sink: opens URL; payload can be file:// or http:// with attacker-controlled handler."
    genuine_code_exec: true

  - module: "http.client"
    name: "HTTPConnection"
    category: "constructor"
    description: "Constructor sink: instantiating HTTPConnection triggers socket creation; usable as nested REDUCE target."
    genuine_code_exec: true

  - module: "asyncio"
    name: "create_subprocess_exec"
    category: "async_injection"
    description: "Async subprocess creation; REDUCE with (prog, args) spawns shell without subprocess.Popen string."
    genuine_code_exec: true

  - module: "asyncio"
    name: "create_subprocess_shell"
    category: "async_injection"
    description: "Async shell subprocess; equivalent to system() in async context, evades sync-only scanners."
    genuine_code_exec: true

  - module: "multiprocessing"
    name: "Process"
    category: "async_injection"
    description: "Constructor sink: Process(target=callable) spawns new process; payload via target arg."
    genuine_code_exec: true

  - module: "socket"
    name: "socket"
    category: "constructor"
    description: "Constructor/network sink: socket() creation for exfiltration; chained with connect/sendto."
    genuine_code_exec: true

  - module: "builtins"
    name: "__build_class__"
    category: "descriptor_abuse"
    description: "Descriptor abuse: __build_class__(exec, 'X', ()) triggers metaclass code execution."
    genuine_code_exec: true

  - module: "builtins"
    name: "property"
    category: "descriptor_abuse"
    description: "Descriptor abuse: property(fget=eval) triggers via attribute access in BUILD."
    genuine_code_exec: true

  - module: "builtins"
    name: "classmethod"
    category: "descriptor_abuse"
    description: "Descriptor abuse: classmethod(eval) wrapping for indirection via descriptor protocol."
    genuine_code_exec: true

  - module: "builtins"
    name: "staticmethod"
    category: "descriptor_abuse"
    description: "Descriptor abuse: staticmethod wrapper for callable indirection."
    genuine_code_exec: true

  - module: "os"
    name: "execv"
    category: "command_execution"
    description: "OS execv variant (POSIX); replaces current process image."
    genuine_code_exec: true

  - module: "os"
    name: "execl"
    category: "command_execution"
    description: "OS execl variant; vararg exec, scanner evasion via execl vs execv."
    genuine_code_exec: true
